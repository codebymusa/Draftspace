services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ConnectionStrings__DraftSpace: Host=db;Database=draftspace;Username=draftspace;Password=draftspace
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: draftspace
      POSTGRES_USER: draftspace
      POSTGRES_PASSWORD: draftspace
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draftspace -d draftspace"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  data:
